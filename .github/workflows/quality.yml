name: tutorial-quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structural-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install structural validator dependency
        run: python -m pip install --disable-pip-version-check nbformat
      - name: Check generated notebooks are reproducible
        run: |
          python scripts/build_course_notebooks.py
          git diff --exit-code -- course labs
      - name: Validate notebooks and maintenance artifacts
        run: python scripts/validate_project.py
