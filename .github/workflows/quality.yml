name: tutorial-quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structural-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook tools
        run: python -m pip install nbformat
      - name: Regenerate active and archived notebooks
        run: |
          python scripts/build_active_units.py
          python scripts/build_legacy_materials.py
          git diff --exit-code -- course reference/legacy
      - name: Validate notebook syntax and local links
        run: python scripts/validate_project.py

  driving-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install driving unit
        run: python -m pip install -r requirements-driving.txt
      - name: Install CPU learning dependencies
        run: python -m pip install -r requirements-learning.txt
      - name: Test the control-to-environment loop
        run: python -m pytest tests -q
      - name: Execute the learning notebooks
        run: python scripts/execute_notebooks.py
      - name: Preserve executed notebooks and trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driving-evidence
          path: artifacts/
